<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallet — KAIROS</title>
<link rel="stylesheet" href="/client/chat.css">
<link rel="stylesheet" href="/client/account.css">
<link rel="stylesheet" href="/client/wallet.css">
</head>
<body class="account-body wallet-body">
<nav class="rail" data-navigation="wallet" aria-label="primary navigation"></nav>
<div class="account-workspace page-workspace">
  <header class="account-topbar">
    <a class="account-brand" href="/">KAIROS</a><span class="account-divider" aria-hidden="true">/</span><span>Wallet</span>
    <a class="account-back" href="/">返回对话 <span aria-hidden="true">↗</span></a>
  </header>
  <main class="account-main">
    <div class="account-heading">
      <div><p class="account-eyebrow">AGENT WALLET</p><h1>Agent 钱包</h1></div>
      <div class="account-refresh-wrap">
        <span id="stamp" class="account-stamp" role="status"></span>
        <button id="refresh" class="account-button" type="button">
          <svg viewBox="0 0 18 18" width="15" height="15" aria-hidden="true"><path d="M14.5 7a5.8 5.8 0 1 0 .2 3M14.5 3v4h-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>刷新</span>
        </button>
      </div>
    </div>
    <div id="root" aria-busy="true"><div class="account-loading" role="status">正在读取钱包…</div></div>
  </main>
</div>
<script type="module" src="/client/navigation.js"></script>
<script type="module" src="/client/wallet.js"></script>
</body>
</html>
