<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KAIROS</title>
<!-- Absolute paths: the page is served at `/` (static.ts's exact route) while
     its assets live under the `/client` prefix, so a relative href would ask
     for `/chat.css` and 404. -->
<link rel="stylesheet" href="/client/chat.css">
</head>
<body>
<!-- The r4 kit's own skeleton, live: two panes, one flow, one composer. Every
     list and every message is built by chat.js through the DOM API — this file
     holds the frame and not one byte of host data. -->
<div class="chat-app">
  <!-- The master rail: market and account open their own pages; strategy,
       agent, memory and plugin switch the sidebar through chat.js. -->
  <nav class="rail" aria-label="primary navigation">
    <a class="rail-btn" href="/market" title="Market" aria-label="Market">
      <svg class="rail-glyph" viewBox="0 0 18 18" width="16" height="16" aria-hidden="true"><polyline points="2,13 6.5,8 10,10.5 16,3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="12,3.5 16,3.5 16,7.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="rail-label">market</span>
    </a>
    <button class="rail-btn active" data-panel="strategy" type="button" title="strategy — workspaces and sessions">
      <span class="rail-glyph">❖</span><span class="rail-label">strategy</span>
    </button>
    <button class="rail-btn" data-panel="agent" type="button" title="agent — model, host, keys, session usage">
      <span class="rail-glyph">◎</span><span class="rail-label">agent</span>
    </button>
    <button class="rail-btn" data-panel="memory" type="button" title="memory — the skill packs Kairos carries">
      <span class="rail-glyph">▤</span><span class="rail-label">memory</span>
    </button>
    <button class="rail-btn" data-panel="plugin" type="button" title="plugin — composed rows and MCP tools">
      <span class="rail-glyph">⚙</span><span class="rail-label">plugin</span>
    </button>
    <a class="rail-btn rail-account" href="/account" title="Account" aria-label="Account">
      <svg class="rail-glyph" viewBox="0 0 18 18" width="16" height="16" aria-hidden="true"><rect x="2" y="4.5" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11.5 9.5h4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="11.8" cy="9.5" r="1" fill="currentColor"/></svg>
      <span class="rail-label">account</span>
    </a>
  </nav>
  <aside class="sidebar" data-panel="strategy">
    <div class="side-head">
      <div class="side-brand">Kairos</div>
      <button id="new-session" class="side-new" type="button" title="start a new conversation">+ new</button>
    </div>
    <div id="conv-list" class="conv-list"></div>
    <!-- The rail's other three faces; chat.js fills each on first open and
         hides all but the active one. -->
    <div id="panel-agent" class="side-panel" hidden></div>
    <div id="panel-memory" class="side-panel" hidden></div>
    <div id="panel-plugin" class="side-panel" hidden></div>
    <div class="side-foot">live · loopback only</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <span id="topbar-name" class="topbar-name">new session</span>
      <span id="topbar-raw" class="raw">raw</span>
    </header>

    <!-- The participants strip: who is in the room and what each is doing,
         built by chat.js from the room projection and the members' own pulses.
         Hidden unless the session on screen is in a channel with bots. -->
    <div id="strip" class="strip" hidden></div>

    <div id="scroll" class="flow">
      <div id="flow" class="flow-inner"></div>
    </div>

    <!-- The right-pane detail view: what a sidebar panel row opens (a skill's
         body, an MCP server's tools, the main agent's cards). Shown in place
         of the flow + composer while `.main` carries `detail-mode`; picking a
         session (or "+ new") brings the chat back. chat.js builds it all. -->
    <div id="detail" class="detail"></div>

    <footer class="composer">
      <form id="composer" class="composer-row">
        <input id="composer-input" class="composer-input" type="text" placeholder="Message Kairos…" autocomplete="off">
        <button id="stop" class="composer-stop" type="button" title="stop the active turn">stop</button>
      </form>
      <div id="status" class="composer-note">starting…</div>
    </footer>
  </main>
</div>
<script type="module" src="/client/chat.js"></script>
</body>
</html>
