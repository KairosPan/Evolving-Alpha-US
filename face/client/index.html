<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KAIROS</title>
<!-- Absolute paths: the page is served at `/` (static.ts's exact route) while
     its assets live under the `/client` prefix, so a relative href would ask
     for `/chat.css` and 404. -->
<link rel="stylesheet" href="/client/chat.css">
</head>
<body>
<!-- The r4 kit's own skeleton, live: two panes, one flow, one composer. Every
     list and every message is built by chat.js through the DOM API — this file
     holds the frame and not one byte of host data. -->
<div class="chat-app">
  <aside class="sidebar">
    <div class="side-head">
      <!-- The way into /market: its own document, its own exact route; it
           links back here through its wordmark. -->
      <a class="corner-link" href="/market" title="Market" aria-label="Market">
        <svg viewBox="0 0 18 18" width="17" height="17" aria-hidden="true"><polyline points="2,13 6.5,8 10,10.5 16,3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="12,3.5 16,3.5 16,7.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="side-brand">Kairos</div>
      <button id="new-session" class="side-new" type="button" title="start a new conversation">+ new</button>
    </div>
    <div id="conv-list" class="conv-list"></div>
    <div class="side-foot">live · loopback only</div>
  </aside>

  <main class="main">
    <header class="topbar">
      <span id="topbar-name" class="topbar-name">new session</span>
      <span id="topbar-raw" class="raw">raw</span>
      <!-- The way into /account, mirrored from the market icon in the
           sidebar head: the page's top-right corner. -->
      <a class="corner-link" href="/account" title="Account" aria-label="Account">
        <svg viewBox="0 0 18 18" width="17" height="17" aria-hidden="true"><rect x="2" y="4.5" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11.5 9.5h4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="11.8" cy="9.5" r="1" fill="currentColor"/></svg>
      </a>
    </header>

    <div id="scroll" class="flow">
      <div id="flow" class="flow-inner"></div>
    </div>

    <footer class="composer">
      <form id="composer" class="composer-row">
        <input id="composer-input" class="composer-input" type="text" placeholder="Message Kairos…" autocomplete="off">
        <button id="stop" class="composer-stop" type="button" title="stop the active turn">stop</button>
      </form>
      <div id="status" class="composer-note">starting…</div>
    </footer>
  </main>
</div>
<script type="module" src="/client/chat.js"></script>
</body>
</html>
