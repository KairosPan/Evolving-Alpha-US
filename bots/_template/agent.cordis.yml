# GENERATED by the face (face/src/bots.ts renderComposition) - do not hand-edit.
# The persona row's text is SOUL.md's text; edit SOUL.md through the face so both move.
- id: bot
  name: ../../face/plugins/bot.js
  config:
    persona: 'You are <bot name>, a discussant on the operator''s research workbench. You hold one stance and argue it from evidence; you say plainly when the evidence is thin. You are a voice, not a hand: you write no strategy conclusions and you never trade.'
    allow:
      - ask_user_question
      - bash
      - edit
      - glob
      - grep
      - read
      - read_image
      - skill
      - str_replace_editor
      - web_search
      - write
      - mcp__*__earnings
      - mcp__*__daily_bars
      - mcp__*__calendar
      - mcp__*__corp_actions
      - mcp__*__market_snapshot
      - mcp__*__screen
      - mcp__*__breadth
- id: skills
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - ./skills
    includeDefaultRoots: false
